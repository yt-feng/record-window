name: Window
on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y age
      - name: Load collection pack
        env:
          PACK_REPO: ${{ secrets.PACK_REPO }}
          PACK_IDENTITY: ${{ secrets.PACK_IDENTITY }}
        run: bash load-pack.sh
      - name: Collect and seal
        id: collect
        env:
          RECIPIENT: ${{ secrets.RESULT_RECIPIENT }}
        run: bash snapshot.sh
      - name: Retain sealed snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/output.age
          retention-days: 60
          if-no-files-found: error
      - name: Check source health
        run: test "$(cat "$RUNNER_TEMP/pack-status")" = 0
